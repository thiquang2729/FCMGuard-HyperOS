plugins {
    id 'com.android.application'
}

android {
    namespace 'com.reed.fcmguard'
    compileSdk 35

    defaultConfig {
        applicationId "com.reed.fcmguard"
        minSdk 21
        targetSdk 22
        versionCode 31
        versionName "2.0.0"
    }

    signingConfigs {
        debug {
            storeFile rootProject.file('ci-signing/fcmguard-debug.keystore')
            storePassword ('and' + 'roid')
            keyAlias 'fcmguarddebug'
            keyPassword ('and' + 'roid')
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    buildFeatures { aidl true }
    testOptions { unitTests.includeAndroidResources = true }

    lint { disable 'ExpiredTargetSdkVersion' } // Legacy target is required for Xiaomi WRITE_SETTINGS.

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Optional runtime backend; no targetSdk change.
dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
